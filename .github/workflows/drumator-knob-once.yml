name: One-time 125A Drumator titanium-blue cap
on:
  push:
    branches:
      - develop/v1.0.1-gui-redesign
    paths:
      - .github/workflows/drumator-knob-once.yml
permissions:
  contents: write
jobs:
  recolor-original-knob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Colorize only original silver cap across 101 frames
        run: python tools/recolor_drumator_knob.py resource/125A_Drumator_Knob.png
      - name: Commit changed binary PNG and remove one-time helper files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "125A-automation"
          git config user.email "125a-automation@users.noreply.github.com"
          git add resource/125A_Drumator_Knob.png
          git rm .github/workflows/drumator-knob-once.yml tools/recolor_drumator_knob.py
          git diff --cached --check
          git commit -m "style(gui): tint original 101-frame knob caps titanium blue"
          git push origin HEAD:refs/heads/develop/v1.0.1-gui-redesign
