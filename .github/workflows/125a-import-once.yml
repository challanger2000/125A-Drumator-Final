name: One-time pinned 125A Drumator source import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/125a-import-once.yml'
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Clone, reproduce and verify every source blob
        shell: bash
        env:
          SOURCE_SHA: 91afadfd643fd32fa49e3d0fdb4ec9e39c9e106b
          VERIFIED_PRODUCT_SHA: a14d9e67470ad0af94a8250baca13fa3a15fb70e
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/drumator-source"
          git clone -q --single-branch --branch gui/ppg-blue-background-20261024 --depth 50 https://github.com/challanger2000/125A-Drumator.git "$src"
          git -C "$src" checkout --detach -q "$SOURCE_SHA"
          test "$(git -C "$src" rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C "$src" diff --name-only "$VERIFIED_PRODUCT_SHA" "$SOURCE_SHA")" = "docs/V1-GUI-SONG-ROW-CORRECTIONS-20261027.md"
          test "$(git -C "$src" ls-files | wc -l)" -eq 166
          # Retain only final-repository Git metadata, not the temporary importer.
          rsync -a --delete --exclude='/.git/' "$src/" ./
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          src=Path(__import__('os').environ['RUNNER_TEMP'])/'drumator-source'
          replacements={
            'CMakeLists.txt':[('project(Drumator VERSION 0.1.0 LANGUAGES CXX)','project(Drumator VERSION 1.0.0 LANGUAGES CXX)')],
            'src/vst3/PluginIDs.h':[('kPluginVersion="0.1.0"','kPluginVersion="1.0.0"')],
            'src/vst3/Factory.cpp':[('https://github.com/challanger2000/125A-Drumator"','https://github.com/challanger2000/125A-Drumator-Final"')],
            '.github/workflows/core-ci.yml':[('branches: [develop/v1.0.0, fix/studio-one-acceptance-20261022, gui/ppg-blue-background-20261024]','branches: [main, release/v1.0.0]')],
            '.github/workflows/125a-plugin-tester-qa.yml':[('repos/challanger2000/125A-Drumator/actions/','repos/challanger2000/125A-Drumator-Final/actions/')],
          }
          for path, edits in replacements.items():
            p=Path(path); old=p.read_text(encoding='utf-8'); new=old
            for before, after in edits:
              n=new.count(before)
              if n<1: raise RuntimeError(f'Missing expected replacement in {path}: {before}')
              new=new.replace(before,after)
            p.write_text(new,encoding='utf-8')
          heading=('# 125A Drumator v1.0.0 — Final repository\n\n'
                   '**Current release candidate (27.10.2026):** Owner-approved GUI/design, '
                   'full imported source from verified product commit '
                   '`a14d9e67470ad0af94a8250baca13fa3a15fb70e` '
                   'plus documentation-only commit '
                   '`91afadfd643fd32fa49e3d0fdb4ec9e39c9e106b`. '
                   'Version updated to 1.0.0; final-repository Windows QA and '
                   'packaging must be confirmed before public V1-FINAL/Gumroad release. '
                   'The old development milestones below are historical.\n\n---\n\n')
          for path in ('README.md','AGENTS.md'):
            p=Path(path)
            p.write_text(heading+p.read_text(encoding='utf-8'),encoding='utf-8')
          Path('CURRENT.md').write_text(
             '# 125A Drumator — Current\n\n'
             '- Target Windows VST3 version: **1.0.0**\n'
             '- Status: **final-repository release candidate**; publication/package not yet verified\n'
             '- Source repo: `challanger2000/125A-Drumator`\n'
             '- Audited product commit: `a14d9e67470ad0af94a8250baca13fa3a15fb70e`\n'
             '- Source export (docs-only additional commit): `91afadfd643fd32fa49e3d0fdb4ec9e39c9e106b`\n'
             '- Windows original source QA: [run 40425541707](https://github.com/challanger2000/125A-Drumator/actions/runs/40425541707), 23/23 CTests, 47/47 Validator, 58/0/0 Tester\n'
             '- Final repository Windows QA: **NOT RUN until its own CI succeeds**\n'
             '- V1-FINAL publication and customer ZIP: **NOT VERIFIED**\n'
             '- Git submodules: **none** in the copied source tree; third-party VST3 SDK is fetched at build time\n',
             encoding='utf-8')
          source_files=subprocess.check_output(['git','-C',str(src),'ls-files','-z']).decode().split('\0')
          source_files=[p for p in source_files if p]
          if len(source_files)!=166: raise RuntimeError('Source track count changed')
          allowed=set(replacements)|{'README.md','AGENTS.md'}
          for rel in source_files:
            if rel in allowed: continue
            a=(src/rel).read_bytes()
            b=Path(rel).read_bytes()
            if hashlib.sha256(a).digest()!=hashlib.sha256(b).digest():
              raise RuntimeError('Source byte mismatch: '+rel)
          actual={str(p) for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts}
          expected=set(source_files)|{'CURRENT.md'}
          if actual!=expected: raise RuntimeError('Unexpected/missing files: '+str(sorted(actual^expected)[:20]))
          assert 'VERSION 1.0.0' in Path('CMakeLists.txt').read_text()
          assert 'kPluginVersion="1.0.0"' in Path('src/vst3/PluginIDs.h').read_text()
          print(f'Verified source migration: {len(source_files)} source files, {len(expected)} final files, 0 mismatched unchanged blobs, 0 submodules')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Migration unexpectedly empty'; exit 1; }
          git commit -qm 'Import verified 125A Drumator source; prepare V1.0.0 release candidate'
          git push origin HEAD:refs/heads/main
          echo "Imported full Final main commit: $(git rev-parse HEAD)"
      - name: Request native Windows 1.0.0 QA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if gh workflow run core-ci.yml -R challanger2000/125A-Drumator-Final --ref main; then
              echo 'Windows QA workflow dispatched'
              exit 0
            fi
            echo "Windows workflow not yet indexed (attempt $attempt); retry"
            sleep 10
          done
          echo '::warning::Windows QA could not be dispatched automatically. Imported source remains an UNVERIFIED V1 candidate.'
