name: Drumator 1.5 - CC0 genre kit candidates
on:
  push:
    branches:
      - feature/v1.5-eight-genre-kits
    paths:
      - 'tools/build_genre_kits.py'
      - '.github/workflows/genre-kit-candidates.yml'
      - 'docs/GENRE-KITS-SOURCES.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample-qa:
    name: Build and audit 8 source-recorded kits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install audio conversion tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 --version
          ffmpeg -version | head -n 1
      - name: Generate 64 samples with provenance
        run: python3 tools/build_genre_kits.py build/genre-kit-candidates
      - name: Inspect artifact
        run: |
          test "$(find build/genre-kit-candidates -name '*.wav' | wc -l)" -eq 64
          test "$(find build/genre-kit-candidates -name '*.wav' -printf '%h\n' | sort -u | wc -l)" -eq 8
          test -s build/genre-kit-candidates/SOURCE-MANIFEST.json
      - name: Pin audited WAVs in feature branch (never main)
        shell: bash
        run: |
          mkdir -p assets/beatcreator
          cp -a build/genre-kit-candidates/. assets/beatcreator/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/beatcreator
          if ! git diff --cached --quiet; then
            git commit -m "assets(BC28): vendor 64 checked CC0 WAVs and source manifest [skip ci]"
            git push origin HEAD:refs/heads/feature/v1.5-eight-genre-kits
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: 125A-Drumator-8-Genre-Kits-CC0-Candidates
          path: build/genre-kit-candidates/
          if-no-files-found: error
          retention-days: 30
